name: Claude Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
jobs:
  claude-review:
    # Dependabot cannot grant id-token: write to the reusable (startup_failure).
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    uses: PSD401/.github/.github/workflows/reusable-claude-review.yml@8c4dbb4e6ae79345ec5f56a96de522e9528e3fb4 # v1.1.0
    secrets:
      BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}

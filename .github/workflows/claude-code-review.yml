name: Claude Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
jobs:
  claude-review:
    # Dependabot cannot grant id-token: write to the reusable (startup_failure).
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    uses: PSD401/.github/.github/workflows/reusable-claude-review.yml@1aa5f5351a78b15f5c71668037f5d35b9613ae41 # PSD401/.github main @ 2026-10-21
    secrets:
      BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}

name: Claude Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
jobs:
  claude-review:
    # Dependabot cannot grant id-token: write to the reusable (startup_failure).
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    uses: PSD401/.github/.github/workflows/reusable-claude-review.yml@bf041d7e251023502d143a5af3b19bdf449ac65c # v1.22.4
    secrets:
      BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}

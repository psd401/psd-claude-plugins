name: OpenWiki Update
on:
  workflow_dispatch:
  # No push trigger: since PSD401/.github v1.2.1 the reusable skips push runs
  # unless the caller passes run_on_push: true, so the Monday run rebuilds the wiki.
  schedule:
    - cron: "0 8 * * 1"

# A manual run started while another is in progress would otherwise queue a
# second full wiki regeneration; only the last one's output survives anyway.
concurrency:
  group: openwiki
  cancel-in-progress: true

jobs:
  openwiki:
    permissions:
      contents: write # caller must grant; org default token is read-only
      pull-requests: write
    # SHA-pinned: every `uses:` ref must be a full commit SHA (ci/check-workflow-pins.js).
    uses: PSD401/.github/.github/workflows/reusable-openwiki.yml@6ffbae4661c29d90aa488ef1e8ad03792d36f0d8 # v1.22.1
    with:
      base_branch: main
    secrets:
      BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
      PSD_AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.PSD_AUTOMATION_APP_PRIVATE_KEY }}

name: OpenWiki Update
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"

# Several merges in a row would otherwise queue a full wiki regeneration each;
# only the last one's output survives anyway.
concurrency:
  group: openwiki
  cancel-in-progress: true

jobs:
  openwiki:
    permissions:
      contents: write # caller must grant; org default token is read-only
      pull-requests: write
    # SHA-pinned: every `uses:` ref must be a full commit SHA (ci/check-workflow-pins.js).
    uses: PSD401/.github/.github/workflows/reusable-openwiki.yml@1aa5f5351a78b15f5c71668037f5d35b9613ae41 # v1.0.0
    with:
      base_branch: main
    secrets:
      BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
      PSD_AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.PSD_AUTOMATION_APP_PRIVATE_KEY }}

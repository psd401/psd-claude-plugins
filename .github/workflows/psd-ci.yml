name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  psd-ci:
    # @main is deliberate: org-owned reusable; central bumps must propagate
    # (psd-dev-standards standards/06). zizmor: ignore[unpinned-uses]
    uses: PSD401/.github/.github/workflows/reusable-psd-ci.yml@main # zizmor: ignore[unpinned-uses]
    with:
      # No lockfile at the root, so the reusable detects `none` and installs no
      # runtime. Pinned uv and bun; Go comes from the runner and fetches the
      # go.mod toolchain (go1.26.5) itself.
      install-command: |
        pipx install uv==0.12.17
        npm install -g bun@1.4.2
        bun --version
        go version
      lint-command: |
        for d in plugins/psd-productivity/skills/parentsquare/cli plugins/psd-productivity/skills/class-intercom/cli; do
          (cd "$d" && test -z "$(gofmt -l .)" && go vet ./...)
        done
        shellcheck --severity=error $(git ls-files '*.sh')
      # Every runnable suite in the repo. plugins/collab/test is not run: it
      # needs the claude-code/testing runtime and is owned upstream
      # (psd401/psd-collab-mcp).
      test-command: |
        (cd plugins/psd-productivity/skills/parentsquare/cli && go test ./...)
        (cd plugins/psd-productivity/skills/class-intercom/cli && go test ./...)
        bun test plugins/psd-productivity/skills/psd-atrium/
        (cd plugins/psd-productivity/skills/psd-brand-guidelines && uv run --with pytest pytest -q test_brand.py)

name: parentsquare-cli-release

# Builds prebuilt parentsquare-pp-cli binaries and publishes them as a GitHub
# Release. The parentsquare skill's scripts/ensure-binary.sh downloads the
# matching asset on first run, so binaries are never committed to the repo.
#
# Trigger: push a tag like `parentsquare-cli-v1.0.0` (keep the version in sync
# with VERSION in plugins/psd-productivity/skills/parentsquare/scripts/ensure-binary.sh).

on:
  push:
    tags:
      - 'parentsquare-cli-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. parentsquare-cli-v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/psd-productivity/skills/parentsquare/cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: plugins/psd-productivity/skills/parentsquare/cli/go.sum
      - name: Cross-build binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {
            local goos="$1" goarch="$2" ext="$3"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -ldflags "-s -w" \
              -o "dist/parentsquare-pp-cli-${goos}-${goarch}${ext}" ./cmd/parentsquare-pp-cli
            gzip -f "dist/parentsquare-pp-cli-${goos}-${goarch}${ext}"
          }
          build darwin  arm64 ""
          build linux   amd64 ""
          build windows amd64 ".exe"
          ls -lh dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/*.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "ParentSquare CLI $TAG" \
            --notes "Prebuilt parentsquare-pp-cli binaries (darwin/arm64, linux/amd64, windows/amd64), gzipped. Auto-fetched by the parentsquare skill's ensure-binary.sh."

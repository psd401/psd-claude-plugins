version: 2
project_name: classintercom-pp-cli
changelog:
  disable: true
builds:
  - id: classintercom-pp-cli
    main: ./cmd/classintercom-pp-cli
    binary: classintercom-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X classintercom-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: classintercom-pp-mcp
    main: ./cmd/classintercom-pp-mcp
    binary: classintercom-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: classintercom-pp-cli
    repository:
      owner: krishagel
      name: homebrew-tap
    homepage: "https://github.com/krishagel/classintercom-pp-cli"
    description: "Discovered API spec for classintercom"
    install: |
      bin.install "classintercom-pp-cli"
      bin.install "classintercom-pp-mcp"
